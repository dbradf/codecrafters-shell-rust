[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1.0.68"                                         # error handling
bytes = "1.3.0"                                           # helps manage buffers
is_executable = "1.0.5"
os_pipe = "1.2.3"
rustyline = { version = "17.0.2", features = ["derive"] }
thiserror = "1.0.38"                                      # error handling

[dev-dependencies]
rstest = "0.26.1"
